name: Cloudflare adapter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  synthetic-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/cloudflare/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/cloudflare
      - run: npm run typecheck --prefix packages/cloudflare
      - run: npm test --prefix packages/cloudflare
      - run: npm run build --prefix packages/cloudflare
      - name: Build full-repository Deploy template
        run: npm run build:cloudflare
      - name: Build generated operator configuration
        run: |
          npm run configure --prefix packages/cloudflare -- vault-agent-ci 11111111-1111-4111-8111-111111111111 lexical free
          npm run build --prefix packages/cloudflare -- --config ../../.cloudflare/wrangler.jsonc
